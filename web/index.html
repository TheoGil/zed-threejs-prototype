<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ZED + three.js</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        overflow: hidden;
      }
      body > canvas {
        position: absolute;
        top: 50%;

        left: 12px;
        bottom: 12px;
        color: #aaa;
        font: 12px monospace;

      #status,

      }

  </head>
  <body>
    <div id="status">connecting…</div>
    <script type="module" src="./src/main.ts"></script>

</html>
